# Maps a `tech:` front-matter entry to a label + an icon file in
# assets/icons/tech/<icon>.svg (Simple Icons, CC0).
#
# Keys are matched lowercased. If a key is missing here, the partial falls
# back to using the entry itself as the icon filename, and renders a plain
# text chip when no matching SVG exists.

