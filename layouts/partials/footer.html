<footer class="site-footer">
  <div class="bar">
    <span class="muted">&copy; {{ now.Format "2006" }} {{ site.Params.author }}</span>
    <nav class="footer-links" aria-label="Elsewhere">
      {{- range site.Params.social }}
      <a href="{{ .url }}" rel="me noopener">{{ .name }}</a>
      {{- end }}
      <a href="{{ site.Params.resume }}">resume</a>
      {{- with site.Home.OutputFormats.Get "rss" }}
      <a href="{{ .RelPermalink }}">rss</a>
      {{- end }}
    </nav>
  </div>
</footer>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("theme-toggle");
  var label = btn && btn.querySelector("[data-theme-label]");
  function paint() {
    var next = root.dataset.theme === "light" ? "dark" : "light";
    if (label) label.textContent = next;
    if (btn) btn.setAttribute("aria-label", "Switch to " + next + " theme");
  }
  paint();
  if (btn) {
    btn.addEventListener("click", function () {
      var next = root.dataset.theme === "light" ? "dark" : "light";
      root.classList.add("no-t");
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      paint();
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { root.classList.remove("no-t"); });
      });
    });
  }
})();
</script>
