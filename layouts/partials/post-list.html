<ol class="rows">
  {{- range . }}
  <li>
    <a class="row" href="{{ .RelPermalink }}">
      <time class="row-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      <span class="row-main">
        <span class="row-title">{{ .Title }}</span>
        {{- with .Description }}
        <span class="row-desc">{{ . }}</span>
        {{- end }}
        {{- with .Params.tags }}
        <span class="row-tags">{{ delimit . " · " }}</span>
        {{- end }}
      </span>
    </a>
  </li>
  {{- else }}
  <li class="row-empty">Nothing here yet.</li>
  {{- end }}
</ol>
