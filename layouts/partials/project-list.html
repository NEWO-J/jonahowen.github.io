<ol class="rows rows-proj">
  {{- range sort . "Params.year" "desc" }}
  <li class="prow">
    <span class="prow-year">{{ .Params.year }}</span>
    <span class="prow-main">
      <a class="prow-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{- with .Description }}
      <span class="prow-desc">{{ . }}</span>
      {{- end }}
    </span>
    {{- with .Params.status }}
    <span class="prow-status" data-status="{{ . | lower }}">{{ . }}</span>
    {{- end }}
    {{- with .Params.repo }}
    <a class="prow-repo" href="{{ . }}" rel="noopener">git</a>
    {{- else }}
    <span class="prow-repo prow-repo-none" aria-hidden="true">&mdash;</span>
    {{- end }}
  </li>
  {{- else }}
  <li class="row-empty">Nothing here yet.</li>
  {{- end }}
</ol>
