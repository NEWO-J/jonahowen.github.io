baseURL: "https://newo-j.github.io"
locale: en-gb
title: "Jonah Owen"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 20

minify:
  disableXML: true
  minifyOutput: true

taxonomies:
  tag: tags

outputs:
  home: [HTML, RSS, JSON]

params:
  description: "Offensive security, hardware hacking, and the tools I build along the way."
  author: "Jonah Owen"
  tagline: "Offensive security · hardware · tooling"
  certs: "OSCP · CPTS · A+ · Network+ · Security+"
  social:
    - name: github
      url: "https://github.com/NEWO-J"
    - name: linkedin
      url: "https://www.linkedin.com/in/jonah-owen-487060321/"

menu:
  main:
    - name: projects
      url: /projects/
      weight: 10
    - name: about
      url: /about/
      weight: 20

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 3
